name: Prune past upcoming

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC
  workflow_dispatch:        # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove past upcoming events
        run: python prune_upcoming.py

      - name: Commit if changed
        run: |
          git config user.name  "megapress-bot"
          git config user.email "bot@megapressevents.com"
          git add data/upcoming.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Prune past upcoming events"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race, retry $i"; sleep 6
          done
          echo "push failed after retries"; exit 1
